# Publishes a release when a GitHub Release is published (which creates its v* tag): archives, checksums and
# deb/rpm/apk uploaded to that release, the Homebrew cask, the GHCR broker image, then npm. Run it by hand
# (Actions -> release -> Run workflow) for a dry run: a snapshot build of everything with nothing published.
# Same shape as pomerium/pomerium's release workflow. See docs/releasing.md.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: snapshot build and npm publish --dry-run, nothing published"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog needs the full history
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A real release only from a published GitHub Release, whose ref is its tag.
      - name: Refuse a manual run that isn't a dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "::error::Publish a GitHub Release to release. Manual runs are dry runs only."
          exit 1

      # The same GoReleaser version as local runs (mise reads .tool-versions).
      - name: Get GoReleaser version
        id: goreleaser-version
        run: echo "version=v$(awk '$1 == "goreleaser" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: release --clean ${{ inputs.dry_run && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # The npm job builds its packages from these binaries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/artifacts.json
            dist/metadata.json
            dist/ptun_*/ptun*
          retention-days: 7

  # Publishes with npm trusted publishing: npm trusts this workflow's OIDC identity, so there's no long-lived token,
  # and every package gets a provenance attestation. Each package's trusted publisher on npmjs.com names this repo,
  # release.yml and the npm environment. See docs/releasing.md.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Trusted publishing needs npm 11.5.1+. Node 26 ships npm 11.20. No registry-url: it writes an .npmrc that
      # expects a token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # NPM_TOKEN is only for the very first publish, before the packages exist and trusted publishing can be set up
      # for them. Delete the secret afterwards.
      - run: |
          if [ -n "$NPM_TOKEN" ] && [ "$DRY_RUN" != true ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          if [ "$DRY_RUN" = true ]; then
            node scripts/npm-publish.mjs --dry-run
          else
            node scripts/npm-publish.mjs
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
