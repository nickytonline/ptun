# tunnel-broker: creates and deletes ephemeral:* Pomerium routes for ptun. See docs/install.md.
# Replace the image and every example.com value. networkpolicy.yaml (required) lets only Pomerium reach this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-broker
  labels: {app.kubernetes.io/name: tunnel-broker}
spec:
  replicas: 1   # leases are in memory; a second replica would split them and sweep each other's tunnels
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: tunnel-broker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tunnel-broker}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tunnel-broker
          image: ghcr.io/nickytonline/tunnel-broker:CHANGE-ME   # a release version, e.g. 0.1.0 (docs/install.md)
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: SHARED_SECRET
              valueFrom: {secretKeyRef: {name: tunnel-broker, key: SHARED_SECRET}}
            # List every Pomerium member, not a Service: with a clustered (Raft) databroker only the leader serves the
            # config API, and a Service would send some calls to followers. One URL only works for a single-instance Core.
            - name: CONFIG_API_URLS
              value: "https://pomerium-0.pomerium-headless.pomerium.svc.cluster.local:5443,https://pomerium-1.pomerium-headless.pomerium.svc.cluster.local:5443,https://pomerium-2.pomerium-headless.pomerium.svc.cluster.local:5443"
            - {name: BROKER_HOST, value: tunnels.example.com}
            - {name: BASE_DOMAIN, value: example.com}
            - {name: SSH_HOST, value: ssh.example.com}
            - {name: SSH_PORT, value: "2200"}
            - {name: ALLOW_PUBLIC_TUNNELS, value: "false"}
            - {name: ALLOW_MCP_TUNNELS, value: "true"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
